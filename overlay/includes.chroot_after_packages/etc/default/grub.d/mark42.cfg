# MARK 42 boot menu settings (dual-boot friendly)
# Menu title "MARK42", but the EFI folder must stay "debian": Debian's signed
# GRUB (Secure Boot) only loads its config from /EFI/debian. grub-mkconfig sets
# grub_mkconfig_dir before reading this file; grub-install does not.
if [ -n "${grub_mkconfig_dir:-}" ]; then
  GRUB_DISTRIBUTOR="MARK42"
else
  GRUB_DISTRIBUTOR="Debian"
fi
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3"
GRUB_GFXMODE="1920x1080,1600x900,1366x768,1280x720,auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_THEME="/boot/grub/themes/mark42/theme.txt"
GRUB_BACKGROUND="/boot/grub/themes/mark42/background.png"
# Detect Windows / other Linux for the dual-boot menu
GRUB_DISABLE_OS_PROBER=false
