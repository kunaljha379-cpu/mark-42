---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
# MARK 42: zsh = commands change colour while typing (bash is still installed)
userShell:       /bin/zsh
# root stays locked; admin access only through sudo / mark / mark42
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=2
        - dictcheck=1
        - usercheck=1
