# MARK 42: load the graphics driver EARLY so the boot animation runs at full
# screen resolution from the first frame. Without this, Plymouth starts on a
# low-res fallback framebuffer and the animation looks slow/choppy until the
# real driver takes over partway through boot. This is the usual cause of a
# "choppy" boot splash, and this setting removes it.
FRAMEBUFFER=y
MODULES=most
