-- MARK 42 HUD system monitor (conky)
conky.config = {
    alignment = 'top_right',
    gap_x = 28, gap_y = 64,
    minimum_width = 290, maximum_width = 290,
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 170,
    own_window_colour = '0c1118',
    double_buffer = true,
    update_interval = 1,
    use_xft = true,
    font = 'Hack:size=9',
    draw_shades = false, draw_outline = false, draw_borders = false,
    border_inner_margin = 14,
    default_color = 'ececec',
    color1 = '64b4ff',
    color2 = '2f7fd6',
    color3 = '1d3550',
    default_bar_width = 290, default_bar_height = 5,
    default_graph_width = 290, default_graph_height = 28,
    top_name_width = 18,
}

conky.text = [[
${color1}${font Inter:Bold:size=22}MARK 42${font}${color}
${color2}${font Hack:size=7}ARMOR SYSTEMS MONITOR  //  ${nodename}${font}${color}
${color3}${hr 2}${color}
${color1}KERNEL${color}${alignr}${kernel}
${color1}UPTIME${color}${alignr}${uptime_short}

${color1}CPU${color}  ${freq_g} GHz${alignr}${cpu cpu0}%
${color2}${cpubar cpu0}${color}
${cpugraph cpu0 1d3550 64b4ff}
${color1}RAM${color}${alignr}${mem} / ${memmax}
${color2}${membar}${color}
${color1}DISK /${color}${alignr}${fs_used /} / ${fs_size /}
${color2}${fs_bar /}${color}
${color1}TEMP${color}${alignr}${hwmon temp 1}°C

${color1}TOP PROCESSES${color}${alignr}CPU   MEM
${top name 1}${alignr}${top cpu 1}  ${top mem 1}
${top name 2}${alignr}${top cpu 2}  ${top mem 2}
${top name 3}${alignr}${top cpu 3}  ${top mem 3}
${color3}${hr 2}${color}
${alignc}${color1}${font Inter:Bold:size=16}${time %H:%M:%S}${font}${color}
${alignc}${time %A  %d %B %Y}
]]
